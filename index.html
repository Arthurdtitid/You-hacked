<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SecureCrypt</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #123b2b, transparent 40%),
        linear-gradient(135deg, #050505, #101010);
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;

      background: rgba(20, 20, 20, 0.95);

      border: 1px solid #333;
      border-radius: 20px;

      padding: 28px;

      box-shadow:
        0 0 30px rgba(0, 255, 140, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
    }

    .description {
      text-align: center;
      color: #999;
      margin-top: 8px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
    }

    textarea {
      width: 100%;
      height: 130px;

      background: #080808;
      color: white;

      border: 1px solid #444;
      border-radius: 12px;

      padding: 15px;

      font-size: 16px;
      outline: none;

      resize: none;
    }

    textarea:focus {
      border-color: #00e67a;
    }

    button {
      width: 100%;

      margin-top: 15px;
      padding: 15px;

      border: none;
      border-radius: 12px;

      background: #00df75;
      color: #001b0d;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.02);
      background: #00ff88;
    }

    .status {
      margin-top: 20px;

      padding: 15px;

      border-radius: 12px;

      background: #080808;
      border: 1px solid #333;

      text-align: center;

      display: none;
    }

    .loading {
      color: #00ff88;
    }

    .result {
      color: #00ff88;
      word-break: break-word;
    }

    footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">🔐</div>

    <h1>SecureCrypt</h1>

    <p class="description">
      Criptografe suas mensagens de forma rápida e simples.
    </p>

    <label for="message">
      Sua mensagem
    </label>

    <textarea
      id="message"
      placeholder="Digite uma mensagem..."
    ></textarea>

    <button onclick="encryptMessage()">
      🔒 Criptografar mensagem
    </button>

    <div class="status" id="status">
      <div class="loading">
        ⏳ Processando...
      </div>
    </div>

    <div class="status" id="result">
      <div class="result" id="resultText"></div>
    </div>

    <footer>
      SecureCrypt © 2026
    </footer>

  </div>

  <script>

    function encryptMessage() {

      const message =
        document.getElementById("message").value;

      const status =
        document.getElementById("status");

      const result =
        document.getElementById("result");

      const resultText =
        document.getElementById("resultText");

      if (message.trim() === "") {

        alert("Digite uma mensagem primeiro!");

        return;
      }

      result.style.display = "none";

      status.style.display = "block";

      setTimeout(function() {

        status.style.display = "none";

        result.style.display = "block";

        const encrypted =
          btoa(
            unescape(
              encodeURIComponent(message)
            )
          );

        resultText.innerHTML =
          "✅ Mensagem criptografada:<br><br>" +
          encrypted;

      }, 1500);

    }

  </script>

</body>
</html>
