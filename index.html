<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo Seguro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111, #333);
            color: white;
        }

        .caixa {
            width: 90%;
            max-width: 420px;
            padding: 30px;
            text-align: center;
            background: #222;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            margin-top: 0;
        }

        button {
            margin-top: 15px;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: #00ff88;
            color: #111;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        #mensagem {
            display: none;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="caixa">
        <h1>📁 Arquivo disponível</h1>

        <p>Clique no botão para continuar.</p>

        <button onclick="baixarArquivo()">
            CONTINUAR
        </button>

        <div id="mensagem">
            😂 VOCÊ FOI TROLLADO!
        </div>
    </div>

    <script>
        function baixarArquivo() {
            const link = document.createElement("a");

            link.href = "troll.mp4";
            link.download = "troll.mp4";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            document.getElementById("mensagem").style.display = "block";
        }
    </script>

</body>
</html>
