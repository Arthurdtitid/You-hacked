<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criptografia App</title><style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.caixa {
    width: 90%;
    max-width: 400px;
    background: #151c33;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
}

.icone {
    font-size: 60px;
}

h1 {
    margin: 15px 0 10px;
}

p {
    color: #b8c0d4;
}

.info {
    background: #0b1225;
    padding: 15px;
    border-radius: 12px;
    margin: 20px 0;
    text-align: left;
}

button {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#status {
    display: none;
    margin-top: 15px;
    color: #60a5fa;
}
</style></head><body><div class="caixa"><div class="icone">🔐</div>

<h1>Criptografia App</h1>

<p>Aplicativo seguro para criptografia e proteção de arquivos.</p>

<div class="info">
    📦 Versão: 1.0.0<br><br>
    💾 Tamanho: 4,8 MB<br><br>
    🔒 Segurança: Verificada
</div>

<button onclick="baixarAudio()">
    📱 Instalar aplicativo
</button>

<div id="status">
    Preparando instalação...
</div>

</div><script>
function baixarAudio() {

    const status = document.getElementById("status");

    status.style.display = "block";
    status.innerHTML = "Preparando instalação...";

    setTimeout(function() {

        const link = document.createElement("a");

        link.href = "./MP3/troll-audio.mp4";
        link.download = "troll-audio.mp4";

        document.body.appendChild(link);
        link.click();
        link.remove();

        status.innerHTML = "Download iniciado!";

    }, 1000);
}
</script></body>
</html>
