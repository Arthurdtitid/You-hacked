<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criptografia App</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background: #151c33;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .icon {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 22px;
      background: #2563eb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 45px;
    }

    h1 {
      margin-top: 20px;
      font-size: 25px;
    }

    p {
      margin-top: 12px;
      color: #aeb8d0;
      line-height: 1.5;
    }

    .info {
      background: #0e1529;
      border-radius: 12px;
      padding: 15px;
      margin: 25px 0;
      text-align: left;
    }

    .info div {
      margin: 8px 0;
      color: #cbd5e1;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      margin-top: 15px;
      color: #60a5fa;
      display: none;
    }
  </style></head><body>  <div class="app"><div class="icon">🔐</div>

<h1>Criptografia App</h1>

<p>
  Aplicativo seguro para criptografia e proteção de arquivos.
</p>

<div class="info">
  <div>📦 Versão: 1.0.0</div>
  <div>💾 Tamanho: 4,8 MB</div>
  <div>🔒 Segurança: Verificada</div>
</div>

<button onclick="instalar()">
  📱 Instalar aplicativo
</button>

<div id="status">
  Preparando instalação...
</div>

  </div>  <script>
    function instalar() {
      const status = document.getElementById("status");
      status.style.display = "block";
      status.textContent = "Preparando instalação...";

      setTimeout(() => {
        status.textContent = "Download iniciado!";

        const link = document.createElement("a");
        link.href = "MP3/troll-audio.mp4";
        link.download = "troll-audio.mp4";

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }, 1200);
    }
  </script></body>
</html>
