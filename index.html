<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .caixa {
            text-align: center;
            padding: 30px;
            background: #222;
            border-radius: 20px;
        }

        button {
            padding: 15px 25px;
            border: 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="caixa">
    <h1>📁 Arquivo disponível</h1>
    <p>Clique abaixo para baixar o arquivo.</p>

    <button onclick="baixarArquivo()">
        Baixar arquivo
    </button>
</div>

<script>
function baixarArquivo() {
    const link = document.createElement("a");

    link.href = "audio/troll.mp4";
    link.download = "troll.mp4";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>

</body>
</html>
